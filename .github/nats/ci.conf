# The test fixture provisions streams and consumers with `admin`. The
# publisher intentionally receives only core publish and reply-inbox access;
# this proves the application does not need JetStream topology permissions.
port: 4222
http: 8222

jetstream {
  store_dir: "/data"
}

authorization {
  users = [
    { user: "admin", password: "admin" }
    {
      user: "publisher",
      password: "publisher",
      permissions: {
        publish: [">"]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
