# The test fixture provisions streams and consumers with `admin`. The
# publisher intentionally receives only core publish and reply-inbox access;
# this proves the application does not need JetStream topology permissions.
port: 4222
http: 8222

jetstream {
  store_dir: "/data"
}

authorization {
  users = [
    { user: "admin", password: "admin" }
    {
      user: "publisher",
      password: "publisher",
      permissions: {
        publish: [">"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: "isolated-publisher",
      password: "isolated-publisher",
      permissions: {
        publish: [
          "inboxisolation.fact.personal.*.*",
          "inboxisolation.fact.group.*.*"
        ]
        subscribe: ["_INBOX.isolated_publisher.>"]
      }
    }
    {
      user: "isolated-consumer",
      password: "isolated-consumer",
      permissions: {
        publish: [
          "$JS.API.CONSUMER.INFO.PROXIMA_INBOX_ISOLATION.inbox-isolation-reference",
          "$JS.API.CONSUMER.MSG.NEXT.PROXIMA_INBOX_ISOLATION.inbox-isolation-reference",
          "$JS.ACK.PROXIMA_INBOX_ISOLATION.inbox-isolation-reference.>"
        ]
        subscribe: ["_INBOX.isolated_consumer.>"]
      }
    }
    {
      user: "cleaner",
      password: "cleaner",
      permissions: {
        publish: [
          "$JS.API.STREAM.INFO.PROXIMA_FACTS",
          "$JS.API.STREAM.MSG.GET.PROXIMA_FACTS",
          "$JS.API.STREAM.MSG.DELETE.PROXIMA_FACTS"
        ]
        subscribe: ["PROXIMA_PURGE_INBOX.>"]
      }
    }
  ]
}
