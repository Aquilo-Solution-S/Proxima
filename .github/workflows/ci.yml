name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main, 'refactor/**']

# Least-privilege default: every job's GITHUB_TOKEN is read-only (no job
# writes contents, packages, or PRs).
permissions:
  contents: read

# Cancel superseded in-progress runs on PR pushes; never cancel a push to a
# protected branch, so a tip commit's required status is never orphaned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt + clippy + doc
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # rust-toolchain.toml pins the channel (1.96.0) + components (rustfmt, clippy).
      # Swatinem/rust-cache@v2.9.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        # Workspace lints set warnings = deny, clippy::pedantic = deny.
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: doc
        # Fail on broken intra-doc links / rustdoc warnings before a public tag.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --locked

  docs:
    name: docs links + status + lean
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: install docs dependencies
        run: python3 -m pip install -r requirements-docs.txt
      - name: mkdocs strict build
        run: python3 -m mkdocs build --strict
      - name: markdown local links
        run: python3 scripts/check-doc-links.py
      - name: docs status labels
        run: python3 scripts/check-doc-status.py
      - name: architecture guardrails
        run: |
          python3 scripts/check-sql-policy.py --self-test
          python3 scripts/check-architecture-guardrails.py --self-test
          python3 scripts/check-schema-ids.py --self-test
          python3 scripts/check-migration-ranges.py --self-test
          python3 scripts/check-architecture-guardrails.py
          python3 scripts/check-sql-policy.py
          python3 scripts/check-schema-ids.py
          python3 scripts/check-migration-ranges.py
      - name: set up Lean/Lake
        # leanprover/lean-action@v1
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: docs/lean
          build: false
          test: false
      - name: lean kernel
        run: cd docs/lean && lake build
      - name: lean axiom pin
        run: |
          python3 scripts/check-lean-axioms.py --self-test
          python3 scripts/check-lean-axioms.py

  deny:
    name: cargo-deny (advisories + licenses + bans + sources)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # cargo-deny-action v2.0.20 pinned by commit SHA (bundles cargo-deny 0.19.8,
      # the schema deny.toml targets). Dependabot's github-actions ecosystem keeps
      # this current via reviewable PRs.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories licenses bans sources

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # Build only, never push. Dependabot bumps the pinned base-image digests
      # weekly (see .github/dependabot.yml); without this job those bumps land
      # with zero validation and the first person to discover a broken image is
      # an operator running the documented `docker build` after a tag is public.
      - name: build image
        run: |
          docker build \
            --build-arg VERSION="$(sed -n 's/^pub const RELEASE_VERSION: &str = "\(.*\)";$/\1/p' crates/core/src/lib.rs)" \
            --build-arg REVISION="${GITHUB_SHA}" \
            -t proxima-mcp:ci .
      - name: image reports its release
        run: |
          docker image inspect proxima-mcp:ci \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'

  test:
    name: test (postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:212765b63c1462883de295c4c415edcd22191b8d8d46853e86ad05d4b577a4cb
        env:
          POSTGRES_USER: proxima
          POSTGRES_PASSWORD: proxima
          POSTGRES_DB: proxima
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxima"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # S3-compatible object store for the cited-blob lane. Without it every
      # test in crates/blob-s3 returns early on `PROXIMA_S3_*` being unset and
      # nextest reports the lane PASSED having executed nothing — including the
      # versioned-bucket `purge_owner_objects` erase, which is a compliance
      # guarantee. RustFS rather than MinIO: Apache-2.0, so it carries none of
      # MinIO's AGPL licensing constraints. Pinned by digest like every other
      # image here; note RustFS is pre-1.0, so bump deliberately.
      s3:
        image: rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c
        env:
          RUSTFS_ACCESS_KEY: proxima
          RUSTFS_SECRET_KEY: proxima-dev
        ports:
          - 9000:9000
    env:
      # Force offline sqlx codegen (committed .sqlx cache) so DATABASE_URL below
      # doesn't make sqlx::query! introspect the un-migrated service at BUILD time.
      SQLX_OFFLINE: "true"
      # pg-testkit clones per-test DBs from this template (admin) URL.
      PROXIMA_TEST_PG_URL: postgres://proxima:proxima@localhost:5432/proxima
      # The HTTP e2e tests boot the facade against a DEDICATED database (created
      # below) so they never contend with pg-testkit's clone source. end_to_end.rs
      # reads DATABASE_URL; oidc_e2e.rs reads PROXIMA_TEST_DATABASE_URL.
      DATABASE_URL: postgres://proxima:proxima@localhost:5432/proxima_e2e
      PROXIMA_TEST_DATABASE_URL: postgres://proxima:proxima@localhost:5432/proxima_e2e
      # Cited-blob lane. `S3RuntimeConfig::present_in_env()` gates those tests
      # on these being set, so they run here rather than silently skipping.
      PROXIMA_S3_BUCKET: proxima-cited-blobs
      PROXIMA_S3_REGION: us-east-1
      PROXIMA_S3_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: proxima
      AWS_SECRET_ACCESS_KEY: proxima-dev
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # self_ingestion_pg shallow-clones the workspace and ingests its
          # most-recent commits; a single-commit CI checkout would starve
          # it, so fetch full history here (the test itself bounds depth).
          fetch-depth: 0
      # Swatinem/rust-cache@v2.9.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: create e2e database
        # Dedicated DB for the HTTP e2e tests, isolated from pg-testkit's
        # per-test clones (psql ships on the ubuntu-latest runner).
        run: psql "postgres://proxima:proxima@localhost:5432/proxima" -c 'CREATE DATABASE proxima_e2e;'
      - name: create cited-blob bucket
        run: |
          # Any HTTP response means it is up. Not `curl -f`: an S3 root
          # request is unauthenticated, so a healthy server answers 403.
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000 && break
            sleep 2
          done
          aws --endpoint-url http://localhost:9000 s3 mb s3://proxima-cited-blobs
          aws --endpoint-url http://localhost:9000 s3api put-bucket-versioning \
            --bucket proxima-cited-blobs \
            --versioning-configuration Status=Enabled
      - name: install nextest
        # taiki-e/install-action@nextest
        uses: taiki-e/install-action@0c80bcf54d007ab0e714c95f3bcc43c387707535
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: test
        run: cargo nextest run --workspace --locked
      - name: test (code flavor — MCP/OIDC e2e)
        # oidc_e2e.rs is #![cfg(feature = "code")]; this step compiles + runs the
        # code-flavor surface (Code tools served over HTTP behind OIDC bearer auth).
        run: cargo nextest run -p proxima-mcp --features code --locked
