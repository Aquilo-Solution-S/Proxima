name: CI

on:
  # Outside contributions still arrive as PRs.
  pull_request:
    branches: [main]
  # verify.yml calls this for each `main` commit it tests. Checkout uses
  # github.sha (the PR merge commit, or the verify caller commit). A probe
  # may then pin a historical main SHA. Rust caches save only when that SHA
  # is main's HEAD: a PR can restore the base branch cache but cannot write
  # it, and a probe cannot poison main's cache with an older tree.
  workflow_call:
    inputs:
      base:
        description: Last verified commit; path filters diff the commit against it.
        type: string
        required: true
      ref:
        description: Commit to validate.
        type: string
        required: true

# Least-privilege default: every job's GITHUB_TOKEN is read-only (no job
# writes contents, packages, or PRs).
permissions:
  contents: read

# A new PR revision supersedes its previous validation run. Verify's probes
# validate several commits at once, so the commit is part of the group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      docs: ${{ steps.paths.outputs.docs }}
      lean: ${{ steps.paths.outputs.lean }}
      dependencies: ${{ steps.paths.outputs.dependencies }}
      image: ${{ steps.paths.outputs.image }}
      release: ${{ steps.paths.outputs.release }}
      all: ${{ steps.paths.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Do not pass `ref:` to actions/checkout. CodeQL treats checkout of a
      # caller-supplied ref in a reusable workflow invoked from a default-
      # branch cache-write event (verify.yml's workflow_dispatch) as
      # untrusted HEAD checkout plus poisonable `cargo`. github.sha is the
      # PR merge or the verify caller commit; probes pin a different main
      # SHA below.
      - name: check out the commit under test
        if: ${{ inputs.ref != '' && inputs.ref != github.sha }}
        env:
          TIP: ${{ inputs.ref }}
        run: |
          git fetch --depth=1 origin "$TIP"
          git checkout --detach "$TIP"
          test "$(git rev-parse HEAD)" = "$TIP"
      # dorny/paths-filter@v4; resolve the PR diff through the GitHub API.
      # Under verify, diff the commit against the last verified one.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: paths
        with:
          base: ${{ inputs.base }}
          ref: ${{ inputs.ref }}
          predicate-quantifier: some-with-excludes
          filters: .github/ci-paths.yml

  # Preserve required check names and run the workflow for every PR into main.
  # Skipped jobs satisfy branch protection; path-filtered workflows stay pending.
  # If path detection fails, run validation instead of skipping it.
  lint:
    name: fmt + clippy + doc
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    # Usually 1-2 min; 20 covers a cold cache.
    timeout-minutes: 20
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: check out the commit under test
        if: ${{ inputs.ref != '' && inputs.ref != github.sha }}
        env:
          TIP: ${{ inputs.ref }}
        run: |
          git fetch --depth=1 origin "$TIP"
          git checkout --detach "$TIP"
          test "$(git rev-parse HEAD)" = "$TIP"
      # rust-toolchain.toml pins the channel (1.96.0) + components (rustfmt, clippy).
      # Swatinem/rust-cache@v2.9.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.ref == github.sha }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        # Workspace lints set warnings = deny, clippy::pedantic = deny.
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: clippy (default features)
        # The test job builds with every feature on, so this is the one place
        # `cfg(not(feature = ..))` code still compiles.
        run: cargo clippy --workspace --all-targets --locked
      - name: doc
        # Fail on broken intra-doc links / rustdoc warnings before a public tag.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --locked

  docs:
    name: docs links + status + lean
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The release-version check answers "is this version already cut?"
          # from the tags. A clone without them reads as "first release ever"
          # and would accept any number at all. The released-migration lock in
          # check-migrations.py reads each tag's tree (`git ls-tree -r
          # <tag>`); checkout fetches `+refs/tags/*` at depth 1, which carries
          # every tag's commit and tree, and the check fails closed without them.
          fetch-tags: true
      - name: check out the commit under test
        if: ${{ inputs.ref != '' && inputs.ref != github.sha }}
        env:
          TIP: ${{ inputs.ref }}
        run: |
          git fetch --depth=1 origin "$TIP"
          git checkout --detach "$TIP"
          test "$(git rev-parse HEAD)" = "$TIP"
      - name: install docs dependencies
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.docs == 'true' }}
        run: python3 -m pip install -r requirements-docs.txt
      - name: mkdocs strict build
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.docs == 'true' }}
        run: python3 -m mkdocs build --strict
      - name: markdown local links
        run: python3 scripts/check-doc-links.py
      - name: docs status labels
        run: python3 scripts/check-doc-status.py
      - name: settings inventory
        run: |
          python3 scripts/check-settings.py --self-test
          python3 scripts/check-settings.py
      - name: install git-cliff
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.release == 'true' }}
        # taiki-e/install-action@v2; same generator as the tag workflow.
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: git-cliff@2.13.1
      - name: release-note configuration
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.release == 'true' }}
        run: |
          shellcheck scripts/changelog.sh
          python3 scripts/check-upgrade-notes.py --self-test
          git cliff --offline --unreleased --output "${RUNNER_TEMP}/release-notes.md"
      # A bump to `proxima_core::RELEASE_VERSION` cuts that tag and publishes
      # its notes once `verified` reaches it (.github/workflows/release.yml).
      # This check is the last moment the number is still free to change.
      - name: release version
        run: |
          python3 scripts/check-release-version.py --self-test
          python3 scripts/verify-culprit.py --self-test
          python3 scripts/check-release-version.py
      - name: architecture guardrails
        run: |
          python3 scripts/check-sql-policy.py --self-test
          python3 scripts/check-architecture-guardrails.py --self-test
          python3 scripts/check-schema-ids.py --self-test
          python3 scripts/check-migrations.py --self-test
          python3 scripts/check-architecture-guardrails.py
          python3 scripts/check-sql-policy.py
          python3 scripts/check-schema-ids.py
          python3 scripts/check-migrations.py
      - name: set up Lean/Lake
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.lean == 'true' }}
        # leanprover/lean-action@v1
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: docs/lean
          build: false
          test: false
      - name: lean kernel
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.lean == 'true' }}
        run: cd docs/lean && lake build
      - name: lean axiom pin
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.lean == 'true' }}
        run: |
          python3 scripts/check-lean-axioms.py --self-test
          python3 scripts/check-lean-axioms.py

  deny:
    name: cargo-deny (advisories + licenses + bans + sources)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.dependencies == 'true') }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: check out the commit under test
        if: ${{ inputs.ref != '' && inputs.ref != github.sha }}
        env:
          TIP: ${{ inputs.ref }}
        run: |
          git fetch --depth=1 origin "$TIP"
          git checkout --detach "$TIP"
          test "$(git rev-parse HEAD)" = "$TIP"
      # cargo-deny-action v2.0.20 pinned by commit SHA (bundles cargo-deny 0.19.8,
      # the schema deny.toml targets). Dependabot's github-actions ecosystem keeps
      # this current via reviewable PRs.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories licenses bans sources

  image:
    name: docker build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-latest
    # Usually 5-8 min; 20 is over 2x the slowest seen.
    timeout-minutes: 20
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: check out the commit under test
        if: ${{ inputs.ref != '' && inputs.ref != github.sha }}
        env:
          TIP: ${{ inputs.ref }}
        run: |
          git fetch --depth=1 origin "$TIP"
          git checkout --detach "$TIP"
          test "$(git rev-parse HEAD)" = "$TIP"
      # Build only, never push. Dependabot bumps the pinned base-image digests
      # weekly (see .github/dependabot.yml); without this job those bumps land
      # with zero validation and the first person to discover a broken image is
      # an operator running the documented `docker build` after a tag is public.
      - name: build image
        run: |
          docker build \
            --build-arg VERSION="$(sed -n 's/^pub const RELEASE_VERSION: &str = "\(.*\)";$/\1/p' crates/core/src/lib.rs)" \
            --build-arg REVISION="$(git rev-parse HEAD)" \
            -t proxima-mcp:ci .
      - name: image reports its release
        run: |
          docker image inspect proxima-mcp:ci \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'

  test:
    name: test (postgres + pgvector)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    # Usually 12-21 min; 45 is about 2x the slowest seen, so a hang that
    # escapes nextest's slow-timeout still cannot hold the serial Verify queue.
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:212765b63c1462883de295c4c415edcd22191b8d8d46853e86ad05d4b577a4cb
        env:
          POSTGRES_USER: proxima
          POSTGRES_PASSWORD: proxima
          POSTGRES_DB: proxima
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxima"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # S3-compatible object store for the cited-blob lane. Without it every
      # test in crates/blob-s3 returns early on `PROXIMA_S3_*` being unset and
      # nextest reports the lane PASSED having executed nothing — including the
      # versioned-bucket `purge_owner_objects` erase, which is a compliance
      # guarantee. RustFS rather than MinIO: Apache-2.0, so it carries none of
      # MinIO's AGPL licensing constraints. Pinned by digest like every other
      # image here; note RustFS is pre-1.0, so bump deliberately.
      s3:
        image: rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c
        env:
          RUSTFS_ACCESS_KEY: proxima
          RUSTFS_SECRET_KEY: proxima-dev
        ports:
          - 9000:9000
    env:
      # pg-testkit clones per-test DBs from this template (admin) URL.
      PROXIMA_TEST_PG_URL: postgres://proxima:proxima@localhost:5432/proxima
      # The catalog, OIDC and multi-owner e2e suites create their own
      # pg-testkit databases, so all-feature and shipped-default hosts can run
      # in the same job.
      # Cited-blob lane. `S3RuntimeConfig::present_in_env()` gates those tests
      # on these being set, so they run here rather than silently skipping.
      PROXIMA_S3_BUCKET: proxima-cited-blobs
      PROXIMA_S3_REGION: us-east-1
      PROXIMA_S3_ENDPOINT_URL: http://localhost:9000
      PROXIMA_S3_ACCESS_KEY_ID: proxima
      PROXIMA_S3_SECRET_ACCESS_KEY: proxima-dev
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: check out the commit under test
        if: ${{ inputs.ref != '' && inputs.ref != github.sha }}
        env:
          TIP: ${{ inputs.ref }}
        run: |
          git fetch --depth=1 origin "$TIP"
          git checkout --detach "$TIP"
          test "$(git rev-parse HEAD)" = "$TIP"
      # Swatinem/rust-cache@v2.9.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.ref == github.sha }}
      - name: relax test Postgres durability, size its connections
        # Disposable database: crash safety buys nothing here. Every per-test
        # DROP DATABASE forces a checkpoint, and with fsync on each one waits
        # on the runner's disk. Those three settings reload; max_connections
        # (the test suite's connection budget, see .config/nextest.toml) only
        # takes effect on a restart, and a service container takes no
        # command-line flags, so the step restarts it.
        run: |
          psql "postgres://proxima:proxima@localhost:5432/proxima" -v ON_ERROR_STOP=1 \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'ALTER SYSTEM SET max_connections = 200'
          docker restart "${{ job.services.postgres.id }}"
          for _ in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U proxima && break
            sleep 2
          done
          test "$(psql "postgres://proxima:proxima@localhost:5432/proxima" -Atc 'SHOW max_connections')" = 200
      - name: create cited-blob bucket
        # The AWS CLI reads only its own variable names; this step alone
        # gets the configured pair under them.
        env:
          AWS_ACCESS_KEY_ID: ${{ env.PROXIMA_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.PROXIMA_S3_SECRET_ACCESS_KEY }}
        run: |
          # Any HTTP response means it is up. Not `curl -f`: an S3 root
          # request is unauthenticated, so a healthy server answers 403.
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000 && break
            sleep 2
          done
          aws --endpoint-url http://localhost:9000 s3 mb s3://proxima-cited-blobs
          aws --endpoint-url http://localhost:9000 s3api put-bucket-versioning \
            --bucket proxima-cited-blobs \
            --versioning-configuration Status=Enabled
      - name: install nextest
        # taiki-e/install-action@v2. The tool is an input, not the `@nextest`
        # tag: a pinned commit names no tool, and a dependabot bump of the pin
        # then installs nothing.
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: nextest
      # All features cover REST. The shipped substrate host also runs its
      # default-feature tests below.
      - name: build
        run: cargo build --workspace --all-targets --all-features --locked
      - name: test
        run: cargo nextest run --workspace --all-targets --all-features --locked
      - name: test shipped host defaults
        run: cargo nextest run -p proxima-mcp --all-targets --locked

  # The storage suites whose correctness depends on what a connection carries
  # between transactions (the export/erase fence, the maintenance lease, the
  # pool's startup parameters), run with their serving pools behind PgBouncer
  # in transaction mode. pg-testkit routes the fixtures' runtime and platform
  # pools through PROXIMA_TEST_PGBOUNCER_URL; migrations and the admin pool
  # stay direct, as production migrations must.
  pgbouncer:
    name: test (pgbouncer transaction mode)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:212765b63c1462883de295c4c415edcd22191b8d8d46853e86ad05d4b577a4cb
        env:
          POSTGRES_USER: proxima
          POSTGRES_PASSWORD: proxima
          POSTGRES_DB: proxima
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxima"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PROXIMA_TEST_PG_URL: postgres://proxima:proxima@localhost:5432/proxima
      PROXIMA_TEST_PGBOUNCER_URL: postgres://proxima:proxima@127.0.0.1:6433/proxima
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: check out the commit under test
        if: ${{ inputs.ref != '' && inputs.ref != github.sha }}
        env:
          TIP: ${{ inputs.ref }}
        run: |
          git fetch --depth=1 origin "$TIP"
          git checkout --detach "$TIP"
          test "$(git rev-parse HEAD)" = "$TIP"
      # Swatinem/rust-cache@v2.9.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.ref == github.sha }}
      - name: start pgbouncer in transaction mode
        # Not a service container: PgBouncer is configured by its ini file,
        # and a service takes no file or command line. It runs as the runner
        # user on its own port.
        #
        # From the PostgreSQL apt repository (PGDG), not Ubuntu's archive:
        # Ubuntu 24.04 ships 1.22.0, and the lane needs 1.26.0 or later.
        # Before 1.26.0, a parameter in track_extra_parameters that the
        # server does not report (statement_timeout is one) misbehaves when
        # a client sets it in its startup packet (PgBouncer #1576); 1.26.1
        # adds security fixes, including one in SCRAM authentication. The
        # step fails on anything older. The repository key is checked
        # against its published fingerprint.
        #
        # SCRAM end to end: clients authenticate against the server's
        # secrets (auth_query as proxima), and PgBouncer logs in to Postgres
        # with the client's SCRAM keys. extra_float_digits is deliberately
        # NOT ignored: the serving pools must not send it.
        run: |
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons "$key" \
            | grep -q '^fpr:::::::::B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8:$'
          echo "deb [signed-by=$key] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q pgbouncer
          sudo systemctl stop pgbouncer || true
          version="$(dpkg-query -W -f='${Version}' pgbouncer)"
          echo "pgbouncer $version"
          dpkg --compare-versions "$version" ge 1.26.1
          dir="$RUNNER_TEMP/pgbouncer"
          mkdir -p "$dir"
          printf '"proxima" "proxima"\n' > "$dir/userlist.txt"
          cat > "$dir/pgbouncer.ini" <<INI
          [databases]
          * = host=localhost port=5432

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6433
          unix_socket_dir =
          auth_type = scram-sha-256
          auth_file = $dir/userlist.txt
          auth_user = proxima
          pool_mode = transaction
          max_client_conn = 2000
          default_pool_size = 20
          max_prepared_statements = 200
          track_extra_parameters = IntervalStyle, statement_timeout
          server_reset_query =
          logfile = $dir/pgbouncer.log
          pidfile = $dir/pgbouncer.pid
          INI
          pgbouncer -d "$dir/pgbouncer.ini"
          for _ in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 6433 && break
            sleep 1
          done
          test "$(psql "$PROXIMA_TEST_PGBOUNCER_URL" -Atc 'SELECT 1')" = 1
      - name: install nextest
        # taiki-e/install-action@v2
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: nextest
      - name: test through pgbouncer
        run: >-
          cargo nextest run -p proxima-storage-pg --all-features --locked
          -E 'binary(pgbouncer_pg) | binary(maintenance_lease_pg) | binary(host_state_lifecycle)
          | binary(purge_backoff) | binary(owner_export) | binary(owner_erase)'
      - name: boot through pgbouncer, migrations direct
        run: cargo nextest run -p proxima --all-features --locked -E 'binary(pooler_boot_pg)'
      - name: every client went through the pooler
        # A lane that silently connected direct would pass and prove nothing.
        run: |
          log="$RUNNER_TEMP/pgbouncer/pgbouncer.log"
          logins="$(grep -c 'login attempt: db=proxima_test' "$log" || true)"
          echo "pooled logins: $logins"
          test "$logins" -gt 100
          boot="$(grep -c 'login attempt: db=proxima_pooler_boot' "$log" || true)"
          echo "pooled boot logins: $boot"
          test "$boot" -gt 0
      - name: pgbouncer log
        if: ${{ failure() }}
        run: tail -n 200 "$RUNNER_TEMP/pgbouncer/pgbouncer.log"
