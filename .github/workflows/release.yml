name: Release

# Publish a GitHub Release when a version tag is pushed. The tagged commit is
# already gated: main is PR-only with the CI jobs as required status checks, so
# every commit reachable from a tag has passed the suite. This workflow only
# turns the tag into a Release, with notes generated by git-cliff from the
# Conventional Commit messages (the same cliff.toml that builds CHANGELOG.md).

on:
  push:
    tags:
      - "v*"

# contents:      write -> create the Release object
# pull-requests: read  -> let git-cliff enrich notes with PR links + authors
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish github release
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # git-cliff needs full history + tags to compute the latest range.
          fetch-depth: 0
      - name: install git-cliff
        # taiki-e/install-action@v2
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419
        with:
          tool: git-cliff@2.13.1
      - name: generate release notes
        env:
          # Enrichment (PR links, authors, contributors). The built-in token
          # has contents+pull-requests read on this repo — no secret to manage.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git cliff --latest --strip header --output RELEASE_NOTES.md
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Pre-1.0 tags ship as pre-releases; flip the gate at the v1 tag.
        run: |
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in
            v0.*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            ${PRERELEASE}
