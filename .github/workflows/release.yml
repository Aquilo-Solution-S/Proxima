name: Release

# A release is cut by MERGING, not by tagging. A PR that bumps
# `proxima_core::RELEASE_VERSION` to a version no tag holds yet becomes
# `v${RELEASE_VERSION}` the moment it lands on main; a merge that leaves the
# constant alone cuts nothing, so ordinary changes accumulate until someone
# decides the next release is worth naming. `scripts/check-release-version.py`
# validates the bump on the PR, where it is still free to fix.
#
# Tagging and releasing are ONE job on purpose: a tag pushed with GITHUB_TOKEN
# does not trigger another workflow, so a separate tag-triggered release would
# never fire for a tag this workflow created.
#
# The `v*` trigger is kept for a tag pushed by hand — a backfill, or a re-run
# after this workflow failed between the tag and the Release.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

# contents:      write -> create the tag and the Release object
# pull-requests: read  -> let git-cliff enrich notes with PR links + authors
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish github release
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # git-cliff needs full history + tags to compute the current release,
          # and the tag lookup below needs every tag to answer "already cut?".
          fetch-depth: 0
      - name: resolve release tag
        id: target
        shell: bash
        run: |
          version="$(sed -n 's/^pub const RELEASE_VERSION: &str = "\([^"]*\)";$/\1/p' crates/core/src/lib.rs)"
          if [[ -z "$version" ]]; then
            echo "::error::crates/core/src/lib.rs declares no RELEASE_VERSION"
            exit 1
          fi
          tag="v${version}"
          # The server reports RELEASE_VERSION over MCP initialize and REST
          # OpenAPI, so a Release naming a version the tagged tree does not
          # declare is a version no client can trust. Refuse the mismatch.
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            printf '::error::Tag %s does not match RELEASE_VERSION (%s)\n' "${GITHUB_REF_NAME}" "${tag}"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]] \
            && git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::notice::${tag} is already released; this merge cuts no tag"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
      - name: create tag
        if: ${{ steps.target.outputs.skip == 'false' && github.ref_type != 'tag' }}
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "refs/tags/${TAG}"
      - name: install git-cliff
        if: ${{ steps.target.outputs.skip == 'false' }}
        # taiki-e/install-action@v2
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: git-cliff@2.13.1
      - name: generate release notes
        if: ${{ steps.target.outputs.skip == 'false' }}
        env:
          # Enrichment (PR links, authors, contributors). The built-in token
          # has contents+pull-requests read on this repo — no secret to manage.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--current` is the tag on the checked-out commit: the one just
        # created, or the one that was pushed by hand. `--latest` would pick
        # the newest tag in history, which is not the same thing.
        run: git cliff --current --strip header --output RELEASE_NOTES.md
      - name: create release
        if: ${{ steps.target.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        # Pre-1.0 tags ship as pre-releases; flip the gate at the v1 tag.
        run: |
          PRERELEASE=""
          case "${TAG}" in
            v0.*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${TAG}" \
            --title "${TAG}" \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            ${PRERELEASE}
