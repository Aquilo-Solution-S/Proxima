name: Release

# Publish a GitHub Release when a version tag is pushed. The tagged commit is
# selected from main after post-merge CI passes (see AGENTS.md). This workflow
# turns the tag into a Release, with notes generated by git-cliff from the
# Conventional Commit messages. GitHub Releases are the canonical changelog.

on:
  push:
    tags:
      - "v*"

# contents:      write -> create the Release object
# pull-requests: read  -> let git-cliff enrich notes with PR links + authors
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish github release
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # git-cliff needs full history + tags to compute the current release.
          fetch-depth: 0
      - name: verify release version
        shell: bash
        run: |
          expected_tag="$(sed -n 's/^pub const RELEASE_VERSION: &str = "\([^"]*\)";$/v\1/p' crates/core/src/lib.rs)"
          if [[ -z "$expected_tag" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            printf '::error::Tag %s does not match RELEASE_VERSION (%s)\n' "$GITHUB_REF_NAME" "$expected_tag"
            exit 1
          fi
      - name: install git-cliff
        # taiki-e/install-action@v2
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419
        with:
          tool: git-cliff@2.13.1
      - name: generate release notes
        env:
          # Enrichment (PR links, authors, contributors). The built-in token
          # has contents+pull-requests read on this repo — no secret to manage.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The tag checkout makes --current exact even if another tag was pushed
        # recently; --latest would select the newest tag reachable in history.
        run: git cliff --current --strip header --output RELEASE_NOTES.md
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Pre-1.0 tags ship as pre-releases; flip the gate at the v1 tag.
        run: |
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in
            v0.*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            ${PRERELEASE}
