[package]
name = "proxiima-example"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Test and tutorial fixture spiice for Proxiima; not a product."

[lib]
name = "proxiima_example"

[features]
default = []
testkit = []

[dependencies]
proxiima = { path = "../../crates/proxiima" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
proxiima = { path = "../../crates/proxiima", features = ["testkit"] }
proxiima-example = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml = { workspace = true }

[lints]
workspace = true
