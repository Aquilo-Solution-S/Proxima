services:
  postgres:
    # pgvector image (NOT plain postgres:18) — the substrate needs the `vector`
    # extension (embeddings; `vector(1024)`) and pg-init/pg-testkit do `CREATE
    # EXTENSION vector`, which needs the .so present in the image.
    image: pgvector/pgvector:pg18
    container_name: proxima_dev_pg
    # Survive Docker/Mac restarts so local Proxima (and aquilo wkh, which shares
    # PROXIMA_TEST_PG_URL) don't silently fail when the box reboots.
    restart: unless-stopped
    environment:
      POSTGRES_USER: proxima
      POSTGRES_PASSWORD: proxima
      POSTGRES_DB: proxima
    ports:
      # Host 5434 (NOT 5432) — the Homebrew postgresql@17 owns 5432 for
      # prometheus/rechnungen/Strassberger. Point Proxima at this via
      # PROXIMA_TEST_PG_URL=postgres://proxima:proxima@localhost:5434/proxima.
      - "5434:5432"
    # Bumped from the 64MB default — test parallelism creates many
    # transient databases and PG's per-backend hash/sort memory plus
    # FK validation scans during `run_migrations` blow the 64MB cap
    # under concurrent `cargo test`.
    shm_size: 1gb
    volumes:
      - proxima_dev_pgdata:/var/lib/postgresql
      - ./scripts/pg-init.sql:/docker-entrypoint-initdb.d/00-pg-stat-statements.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements,auto_explain"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "auto_explain.log_min_duration=50ms"
      - "-c"
      - "auto_explain.log_analyze=on"
      - "-c"
      - "log_destination=stderr"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxima -d proxima"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: proxima_dev_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: proxima
      MINIO_ROOT_PASSWORD: proxima-dev
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - proxima_dev_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 proxima proxima-dev
        mc mb --ignore-existing local/proxima-dev

volumes:
  proxima_dev_pgdata:
  proxima_dev_minio_data:
