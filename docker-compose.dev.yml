services:
  postgres:
    # pgvector image (NOT plain postgres:18) — the substrate needs the `vector`
    # extension (embeddings; `vector(1024)`) and pg-init/pg-testkit do `CREATE
    # EXTENSION vector`, which needs the .so present in the image.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: proxima
      POSTGRES_PASSWORD: proxima
      POSTGRES_DB: proxima
    ports:
      # The host default is 5434 for compatibility. Override with
      # PROXIMA_DEV_POSTGRES_PORT when that port is already in use.
      - "127.0.0.1:${PROXIMA_DEV_POSTGRES_PORT:-5434}:5432"
    # Bumped from the 64MB default — test parallelism creates many
    # transient databases and PG's per-backend hash/sort memory plus
    # FK validation scans during `run_migrations` blow the 64MB cap
    # under concurrent `cargo test`.
    shm_size: 1gb
    volumes:
      - proxima_dev_pgdata:/var/lib/postgresql
      - ./scripts/pg-init.sql:/docker-entrypoint-initdb.d/00-pg-stat-statements.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements,auto_explain"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "auto_explain.log_min_duration=50ms"
      - "-c"
      - "auto_explain.log_analyze=on"
      - "-c"
      - "log_destination=stderr"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxima -d proxima"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object store for the cited-blob lane. RustFS (Apache-2.0)
  # rather than MinIO, whose AGPL terms and community-edition feature removals
  # make it awkward to depend on for a dev fixture.
  s3:
    image: rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c
    environment:
      RUSTFS_ACCESS_KEY: proxima
      RUSTFS_SECRET_KEY: proxima-dev
    ports:
      # The host default is 9100 for compatibility. Override with
      # PROXIMA_DEV_S3_PORT when that port is already in use.
      - "127.0.0.1:${PROXIMA_DEV_S3_PORT:-9100}:9000"
    volumes:
      - proxima_dev_s3_data:/data
    healthcheck:
      # Any HTTP response means it is listening and serving. Not `curl -f`:
      # an S3 root request is unauthenticated, so a healthy server answers
      # 403 and `-f` would treat that as failure forever.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the dev bucket with versioning on — compliance erase
  # (`purge_owner_objects`) deletes every version, so a non-versioned bucket
  # would not exercise it.
  s3-init:
    image: amazon/aws-cli:2.36.8@sha256:7e1b11a3c93bc5af81f496de0662f666b2352a4a6666e8ebae904fe102b131b6
    profiles: ["init"]
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: proxima
      AWS_SECRET_ACCESS_KEY: proxima-dev
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        aws --endpoint-url http://s3:9000 s3 mb s3://proxima-dev || true
        aws --endpoint-url http://s3:9000 s3api put-bucket-versioning \
          --bucket proxima-dev --versioning-configuration Status=Enabled

volumes:
  proxima_dev_pgdata:
  proxima_dev_s3_data:
