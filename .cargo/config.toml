# Compile-time performance optimizations for Proxima workspace
# See: https://doc.rust-lang.org/cargo/reference/config.html

[build]
# Enable incremental compilation - cache compilation artifacts between builds
# This is the single biggest win for iterative development
incremental = true

# Number of parallel jobs for compilation
# Use number of CPU cores (empty = auto-detect)
jobs = 8

# Use pipelined compilation where possible (Rust 1.70+)
pipelining = true

# Environment variables for faster native code compilation (tree-sitter, etc.)
# The `cc` crate (used by tree-sitter) caches compiled C objects in target/
# by default. To use ccache (more effective caching), install it:
#   brew install ccache
# Then either:
#   1. Prepend ccache symlinks to PATH:
#      export PATH="/opt/homebrew/opt/ccache/libexec:$PATH"
#   2. Or set CC=ccache
#
# With ccache enabled, workspace builds go from minutes to seconds.
# Tested results:
#   - First build: ~16s (with ccache caching C compilation)
#   - Subsequent builds: ~0.6s (full cache hits)
#   - Without ccache: ~10-15s for proxima-core, much longer for full workspace

[profile.dev]
# Optimize debug builds slightly for faster compilation
# opt-level=1 gives ~10-20% faster compiles with minimal runtime impact
opt-level = 1

# Disable full debug info for dependencies in dev mode (huge speedup)
split-debuginfo = "unpacked"

[profile.release]
# Enable link-time optimization for release builds
lto = "thin"

# Parallel code generation for release builds
codegen-units = 16

[profile.release.build-override]
# Optimize build scripts in release mode
opt-level = 3

[profile.bench]
# Benchmark profile inherits from release
inherits = "release"
debug = true
