[[bin]]
name = "proxima-code"
path = "src/main.rs"

[dependencies]
proxima-core = { path = "../../core" }
proxima-storage-pg = { path = "../../storage-pg" }
proxima-code = { path = "../../flavors/code" }
proxima-llm-ollama = { path = "../../llm-ollama" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { workspace = true }

[lints]
workspace = true
