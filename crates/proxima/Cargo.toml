[package]
name = "proxima"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
proxima-core = { path = "../core" }
# auth-oidc: the only Authenticator that ships. Optional and on by default
# because `Proxima::app().authenticator(..)` is otherwise a public builder
# method taking a type no out-of-tree host can construct — and MCP serving
# refuses insecure single-owner mode, so without this there is no way for a
# flavor outside this repo to serve MCP at all. Optional so an embedded
# host that only uses the Host API can drop the JWT and HTTP stack.
proxima-auth-oidc = { path = "../auth-oidc", optional = true }
proxima-storage-pg = { path = "../storage-pg", features = ["backend-api"] }
proxima-blob-s3 = { path = "../blob-s3" }
proxima-llm-openai-compat = { path = "../llm-openai-compat", optional = true }
proxima-mcp-server = { path = "../mcp-server" }
proxima-pg-testkit = { path = "../pg-testkit", optional = true }
async-trait = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
# Re-exported as `proxima::rmcp` so a host implementing `ServerHandler` around
# `DynamicHandler` builds against the version and feature set Proxima pins.
# Already linked through `proxima-mcp-server`; declaring it adds no code.
rmcp = { workspace = true }
# The built-in HTTP outbox sink (docs/18 §Built-in HTTP sink).
reqwest = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "time"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[features]
default = ["openai-compat-embed", "auth-oidc"]
auth-oidc = ["dep:proxima-auth-oidc"]
openai-compat-embed = ["dep:proxima-llm-openai-compat"]
# Compile the `/v1` REST rendering of the tool manifest (docs/17). Compiling
# it is not enabling it: the surface still needs `PROXIMA_REST_ENABLED`.
rest = ["proxima-mcp-server/rest"]
# Test support for flavor crates (`proxima::testkit`): PG fixtures, a verified
# owner-scoped AuthzContext (core `test-fixtures`), split-role databases and
# the trigger drift assertion.
testkit = ["dep:proxima-pg-testkit", "proxima-core/test-fixtures"]

[dev-dependencies]
proxima-example = { path = "../../flavors/example", features = ["testkit"] }
proxima-storage-pg = { path = "../storage-pg", features = ["test-fixtures"] }
aws-lc-rs = { workspace = true }
aws-sdk-s3 = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
proxima-core = { path = "../core", features = ["test-fixtures"] }
proxima-pg-testkit = { path = "../pg-testkit" }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
time = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true }

