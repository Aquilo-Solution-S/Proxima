[package]
name = "proxima"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
proxima-core = { path = "../core" }
# auth-oidc: the only Authenticator that ships. Optional and on by default
# because `Proxima::app().authenticator(..)` is otherwise a public builder
# method taking a type no out-of-tree host can construct — and MCP serving
# refuses insecure single-owner mode, so without this there is no way for a
# flavor outside this repo to serve MCP at all. Optional so an embedded
# host that only uses the Host API can drop the JWT and HTTP stack.
proxima-auth-oidc = { path = "../auth-oidc", optional = true }
proxima-storage-pg = { path = "../storage-pg", features = ["backend-api"] }
proxima-blob-s3 = { path = "../blob-s3" }
proxima-llm-openai-compat = { path = "../llm-openai-compat", optional = true }
proxima-mcp-server = { path = "../mcp-server" }
proxima-pg-testkit = { path = "../pg-testkit", optional = true }
axum = { workspace = true }
http = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[features]
default = ["openai-compat-embed", "auth-oidc"]
auth-oidc = ["dep:proxima-auth-oidc"]
openai-compat-embed = ["dep:proxima-llm-openai-compat"]
# Compile the `/v1` REST rendering of the tool manifest (docs/17). Compiling
# it is not enabling it: the surface still needs `PROXIMA_REST_ENABLED`.
rest = ["proxima-mcp-server/rest"]
testkit = ["dep:proxima-pg-testkit"]

[dev-dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
proxima-core = { path = "../core", features = ["test-fixtures"] }
proxima-pg-testkit = { path = "../pg-testkit" }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
time = { workspace = true }
tower = { workspace = true, features = ["util"] }
