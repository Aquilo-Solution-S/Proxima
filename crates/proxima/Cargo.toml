[package]
name = "proxima"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
proxima-core = { path = "../core" }
# auth-oidc: the only Authenticator that ships. Optional and on by default
# because `Proxima::app().authenticator(..)` is otherwise a public builder
# method taking a type no out-of-tree host can construct — and MCP serving
# refuses insecure single-owner mode, so without this there is no way for a
# flavor outside this repo to serve MCP at all. Optional so an embedded
# host that only uses the Host API can drop the JWT and HTTP stack.
proxima-auth-oidc = { path = "../auth-oidc", optional = true }
proxima-storage-pg = { path = "../storage-pg", features = ["backend-api"] }
proxima-blob-s3 = { path = "../blob-s3" }
proxima-llm-openai-compat = { path = "../llm-openai-compat", optional = true }
proxima-mcp-server = { path = "../mcp-server" }
# outbox-nats: the shipped Fact-outbox publisher (docs/18). Optional and
# OFF by default — a deployment that registers no listenable schema should
# not link a broker client, and the boot guarantee that a listenable schema
# needs a bound source holds without it.
proxima-outbox-nats = { path = "../outbox-nats", optional = true }
proxima-pg-testkit = { path = "../pg-testkit", optional = true }
async-trait = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[features]
default = ["openai-compat-embed", "auth-oidc"]
auth-oidc = ["dep:proxima-auth-oidc"]
openai-compat-embed = ["dep:proxima-llm-openai-compat"]
# Compile the NATS JetStream publisher and the reference consumer. Compiling
# is not enabling: the publisher still needs `PROXIMA_NATS_URL`.
outbox-nats = ["dep:proxima-outbox-nats"]
# Compile the `/v1` REST rendering of the tool manifest (docs/17). Compiling
# it is not enabling it: the surface still needs `PROXIMA_REST_ENABLED`.
rest = ["proxima-mcp-server/rest"]
# Test support for flavor crates (`proxima::testkit`): PG fixtures, a verified
# owner-scoped AuthzContext (core `test-fixtures`), split-role databases and
# the trigger drift assertion.
testkit = ["dep:proxima-pg-testkit", "proxima-core/test-fixtures"]

[dev-dependencies]
proxima-code = { path = "../../flavors/code" }
proxima-storage-pg = { path = "../storage-pg", features = ["test-fixtures"] }
async-nats = { workspace = true, features = ["nkeys"] }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
futures = { workspace = true }
proxima-core = { path = "../core", features = ["test-fixtures"] }
proxima-pg-testkit = { path = "../pg-testkit" }
tokio = { workspace = true, features = ["io-util"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
time = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing-subscriber = { workspace = true }

[[test]]
name = "publication_supervision_pg"
required-features = ["outbox-nats"]

[[test]]
name = "flavor_kit_pg"
required-features = ["testkit"]
