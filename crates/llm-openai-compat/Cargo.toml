[package]
name = "proxima-llm-openai-compat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "proxima_llm_openai_compat"

[dependencies]
proxima-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }

[dev-dependencies]
# The input cap's whole claim is that an over-limit input is refused
# *without a request being made*, which can only be shown by pointing a real
# client at an endpoint that would fail if it were reached.
tokio = { workspace = true }

[lints]
workspace = true
