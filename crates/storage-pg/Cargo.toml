[package]
name = "proxima-storage-pg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "proxima_storage_pg"

[dependencies]
proxima-core = { path = "../core" }
proxima-pg-testkit = { path = "../pg-testkit", optional = true }
sqlx = { workspace = true, features = ["json", "rust_decimal"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
time = { workspace = true }
blake3 = { workspace = true }

[features]
default = []
backend-api = []
test-fixtures = ["dep:proxima-pg-testkit", "proxima-core/test-fixtures"]

[lints]
workspace = true

[dev-dependencies]
proxima-core = { path = "../core", features = ["test-fixtures"] }
proxima-pg-testkit = { path = "../pg-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
time = { workspace = true }
tokio-stream = { workspace = true }
