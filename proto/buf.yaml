version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # File layout: one-message-set-per-file (messages.proto /
    # engine.proto) under package `proxima.v1`, not file-per-package.
    - PACKAGE_DIRECTORY_MATCH
    # `service Engine` (not `EngineService`) — matches the Rust
    # `Engine` type and the wire service named in docs/09.
    - SERVICE_SUFFIX
    # `Subscribe` returns direct `ChangeEvent` values, not a wrapper
    # response message.
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
