site_name: Proxima
site_description: Typed durable memory substrate for agentic systems
repo_url: https://github.com/Aquilo-Solution-S/Proxima
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
validation:
  links:
    not_found: ignore
    anchors: ignore
exclude_docs: |
  superpowers/
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Decisions: decisions.md
  - Get started: get-started.md
  - Agents: agents.md
  - Build a flavor: build-a-flavor.md
  - Host integration: host-integration.md
  - Protocol: protocol.md
  - Operate: operate.md
  - Configuration: configuration.md
  - Data and erasure: data-and-erasure.md
  - Contributing: contributing.md
