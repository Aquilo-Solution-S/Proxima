[package]
name = "proxiima-dev-migrate"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dev-migrate"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
proxiima = { path = "../../crates/proxiima" }
proxiima-core = { path = "../../crates/core" }
proxiima-storage-pg = { path = "../../crates/storage-pg", features = ["backend-api"] }
proxiima-example = { path = "../../spiices/example" }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
proxiima-pg-testkit = { path = "../../crates/pg-testkit" }
proxiima-storage-pg = { path = "../../crates/storage-pg", features = ["test-fixtures"] }
