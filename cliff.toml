# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# CHANGELOG.md is GENERATED from Conventional Commit messages — do not hand-edit;
# run `scripts/changelog.sh` to regenerate. Per-tag GitHub Release notes are
# produced in CI from this same config (.github/workflows/release.yml runs
# `git cliff --latest`).
#
# GitHub enrichment (PR links, authors, first-time contributors) needs a token:
#   * locally  — scripts/changelog.sh exports `GITHUB_TOKEN=$(gh auth token)`
#   * in CI    — the workflow passes `GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}`
# Running bare `git cliff` with NO token (or an empty one) panics because
# [remote.github] makes it call the API — always go through scripts/changelog.sh.
# Commit/compare URLs are hardcoded, so links never depend on the API succeeding.

[remote.github]
owner = "Aquilo-Solution-S"
repo = "Proxima"

[changelog]
header = """
# Changelog

All notable changes to Proxima, generated from [Conventional Commits](https://www.conventionalcommits.org) \
by [git-cliff](https://git-cliff.org). Do not edit by hand — run `scripts/changelog.sh` to regenerate.

Pre-1.0 the git tag (e.g. `v0.0.3`) is the version; workspace crates are unpublished (`publish = false`).\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/Aquilo-Solution-S/Proxima
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {%- for commit in commits %}
        - {% if commit.breaking %}**breaking:** {% endif %}\
          {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first | trim }} \
          ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }}))\
          {%- if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}\
          {%- if commit.remote.username %} by @{{ commit.remote.username }}{% endif -%}
    {%- endfor %}
{% endfor %}
{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}

### New Contributors
{%- for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
- @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{%- endfor %}
{%- endif %}\n
"""
footer = """
{%- macro remote_url() -%}
  https://github.com/Aquilo-Solution-S/Proxima
{%- endmacro -%}

{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                {{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
        {% endif -%}
    {% else -%}
        [unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Drop commits that are not Conventional (merge commits, early prehistory).
filter_unconventional = true
commit_preprocessors = [
  # Strip trailing "(#123)" issue/PR suffixes.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
# Type-based grouping for Conventional Commits. The `<!-- N -->` prefixes only
# set group order; `striptags` removes them before rendering. chore/ci/build/
# style are skipped as changelog noise; chore(deps) is surfaced (Dependabot).
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^chore\\(deps\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^chore\\(ci\\)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^revert", group = "<!-- 7 -->Reverts" },
]
# Drop commits not matched by any parser above. Early prehistory used
# milestone-style subjects ("M6.26: ...", "Plan: ...", "Spec: ...") that parse
# as bogus Conventional types; this filters them out, keeping only real
# feat/fix/perf/refactor/docs/test/deps/revert entries.
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
