[workspace]
resolver = "3"
members = ["core", "bin/proxima-engine", "bin/proxima-code", "flavors/code", "llm-openai-compat", "proxima-shell/src-tauri", "storage-pg", "wire-grpc"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Aquilo-Solution-S/Proxima"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "macros", "migrate"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
blake3 = "1"
ciborium = "0.2"
time = { version = "0.3", default-features = false, features = ["serde", "serde-human-readable", "serde-well-known", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }

# tree-sitter deps for code flavor (Rust + TypeScript).
# Version trio verified to build together on rust 1.95 + edition 2024:
# tree-sitter 0.25, tree-sitter-rust 0.24, tree-sitter-typescript 0.23.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

# gRPC wire layer
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server", "transport"] }
prost = "0.14"
prost-types = "0.14"

# tauri 2 desktop shell
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# OS-native keychain access for secret_ref resolution (S1.c)
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }

# specta — Rust→TS type bridge for tauri-specta. Source-of-truth
# stays Rust traits; TS bindings are codegen artefacts. See
# docs/09 §Generation pipeline.
specta = { version = "=2.0.0-rc.24", features = ["derive", "uuid", "time"] }
specta-typescript = "=0.0.11"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
