[workspace]
resolver = "3"
members = ["crates/core", "crates/mcp-server", "apps/proxima-mcp", "flavors/code", "crates/llm-openai-compat", "crates/storage-pg", "crates/blob-s3", "crates/proxima", "crates/pg-testkit", "examples/embedded-minimal", "tools/dev-migrate", "crates/auth-oidc"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/Aquilo-Solution-S/Proxima"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", default-features = false, features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "macros", "migrate"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
blake3 = "1"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "serde", "serde-human-readable", "serde-well-known", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
rmcp = { version = "1.6", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1", "preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio-util = "0.7"
tower = "0.5"
hex = "0.4"
sha2 = "0.10"
aws-config = "1"
# Drop aws-sdk-s3's default `rustls` feature: it pulls the LEGACY rustls 0.21
# stack (aws-smithy-http-client/legacy-rustls-ring -> rustls-webpki 0.101.7,
# RUSTSEC-2026-0098/0099/0104). `default-https-client` (kept) uses the modern
# rustls 0.23 + aws-lc-rs client instead; aws-lc-sys is already in the tree.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
] }

# tree-sitter deps for code flavor (Rust + TypeScript).
# Version trio verified to build together on rust 1.96 + edition 2024:
# tree-sitter 0.25, tree-sitter-rust 0.24, tree-sitter-typescript 0.23.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimize build scripts (e.g. tree-sitter cc builds) even in release.
[profile.release.build-override]
opt-level = 3
