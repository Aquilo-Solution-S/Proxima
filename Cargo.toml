[workspace]
resolver = "3"
members = ["crates/core", "crates/mcp-server", "apps/proxima-mcp", "flavors/code", "crates/llm-openai-compat", "crates/storage-pg", "crates/blob-s3", "crates/proxima", "crates/pg-testkit", "tools/dev-migrate", "tools/dev-idp", "crates/auth-oidc"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/Aquilo-Solution-S/Proxima"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", default-features = false, features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "time", "macros", "migrate", "sqlx-toml"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
blake3 = "1"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "serde", "serde-human-readable", "serde-well-known", "std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1", "preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# v10 split the crypto backend out of default features (default = ["use_pem"] only),
# so a bare dep panics at first RS256 sign/verify ("could not determine CryptoProvider").
# Enable the aws-lc-rs backend to match the workspace's rustls-0.23/aws-lc-rs posture
# (already in-tree) and avoid the `rust_crypto` backend's `rsa` dep (RUSTSEC-2023-0071).
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
aws-lc-rs = "1"
base64 = "0.23"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio-util = "0.7"
tower = "0.5"
hex = "0.4"
whatlang = "0.18"
# Ingest scoping. `git ls-tree` takes no pathspec magic (no `:(exclude)`, no
# `:(glob)`) and the incremental poller lists arbitrary commit SHAs, where
# `git ls-files` cannot reach at all — so scope matching happens in-process
# over the listing. globset is ripgrep's matcher: gitignore-shaped `**`
# semantics, and it compiles a pattern set into one automaton rather than
# testing patterns one at a time per path.
globset = "0.4"
sha2 = "0.11"
aws-config = "1"
# Drop aws-sdk-s3's default `rustls` feature: it pulls the LEGACY rustls 0.21
# stack (aws-smithy-http-client/legacy-rustls-ring -> rustls-webpki 0.101.7,
# RUSTSEC-2026-0098/0099/0104). `default-https-client` (kept) uses the modern
# rustls 0.23 + aws-lc-rs client instead; aws-lc-sys is already in the tree.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
] }

# tree-sitter deps for the code flavor (Rust + TypeScript). Core and grammar
# crates version independently and must stay ABI-compatible, so bump them as a
# set and let CI confirm they parse (workspace nextest, code flavor default-on).
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimize build scripts (e.g. tree-sitter cc builds) even in release.
[profile.release.build-override]
opt-level = 3
