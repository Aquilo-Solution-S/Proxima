[workspace]
resolver = "3"
members = ["crates/core", "crates/mcp-server", "apps/proxima-mcp", "flavors/example", "crates/llm-openai-compat", "crates/storage-pg", "crates/blob-s3", "crates/proxima", "crates/pg-testkit", "tools/dev-migrate", "tools/dev-idp", "crates/auth-oidc"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/Aquilo-Solution-S/Proxima"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rust_decimal = { version = "1.36.0", default-features = false, features = ["serde"] }
uuid = { version = "1.12.1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2.0.18"
tokio = { version = "1.40.0", default-features = false, features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "time", "macros", "migrate", "sqlx-toml"] }
# Binary `vector` / `halfvec` binds (#379): a text bind cast in SQL is not a
# constant under a generic plan, so the server re-parses it per scored row.
pgvector = { version = "0.4.2", default-features = false, features = ["sqlx", "halfvec"] }
url = "2.5.4"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1.89"
bytes = "1.11.1"
blake3 = "1"
time = { version = "0.3.47", default-features = false, features = ["formatting", "parsing", "serde", "serde-human-readable", "serde-well-known", "std", "large-dates"] }
tracing = { version = "0.1.40", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["uuid1", "preserve_order"] }
# JSON Schema validator for tests only: tool results are checked against the
# output schemas the server publishes (apps/proxima-mcp end_to_end).
boon = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# v10 split the crypto backend out of default features (default = ["use_pem"] only),
# so a bare dep panics at first RS256 sign/verify ("could not determine CryptoProvider").
# Enable the aws-lc-rs backend to match the workspace's rustls-0.23/aws-lc-rs posture
# (already in-tree) and avoid the `rust_crypto` backend's `rsa` dep (RUSTSEC-2023-0071).
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
aws-lc-rs = "1.15.0"
base64 = "0.23"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http = "1.5"
httpdate = "1.0.3"
http-body = "1"
http-body-util = "0.1.2"
tokio-util = "0.7.9"
tower = "0.5.2"
hex = "0.4.3"
whatlang = "0.18"
sha2 = "0.11"
# Drop aws-sdk-s3's default `rustls` feature: it pulls the LEGACY rustls 0.21
# stack (aws-smithy-http-client/legacy-rustls-ring -> rustls-webpki 0.101.7,
# RUSTSEC-2026-0098/0099/0104). `default-https-client` (kept) uses the modern
# rustls 0.23 + aws-lc-rs client instead; aws-lc-sys is already in the tree.
aws-sdk-s3 = { version = "1.79.0", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimize build scripts (e.g. tree-sitter cc builds) even in release.
[profile.release.build-override]
opt-level = 3
