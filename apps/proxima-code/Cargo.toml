[package]
name = "proxima-code-bin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "proxima-code"
path = "src/main.rs"

[dependencies]
proxima-core = { path = "../../crates/core" }
proxima-storage-pg = { path = "../../crates/storage-pg" }
proxima-code = { path = "../../flavors/code" }
proxima-llm-openai-compat = { path = "../../crates/llm-openai-compat" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { workspace = true }

[lints]
workspace = true
