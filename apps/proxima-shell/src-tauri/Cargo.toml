[package]
name = "proxima-shell"
version = "0.1.0"
description = "Proxima desktop shell"
authors = ["you"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "proxima_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
proxima-core = { path = "../../../crates/core" }
proxima-storage-pg = { path = "../../../crates/storage-pg" }
proxima-code = { path = "../../../flavors/code" }
proxima-llm-openai-compat = { path = "../../../crates/llm-openai-compat" }
keyring = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { workspace = true }
dotenvy = "0.15"
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }

[lints]
workspace = true
