[package]
name = "proxima-shell"
version = "0.1.0"
description = "Proxima desktop shell"
authors = ["you"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "proxima_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
proxima-codex-auth = { path = "../../../crates/codex-auth" }
proxima-blob-s3 = { path = "../../../crates/blob-s3" }
proxima-core = { path = "../../../crates/core" }
proxima-embed = { path = "../../../crates/embed" }
proxima-harness = { path = "../../../crates/harness", features = ["chatgpt-codex"] }
proxima-storage-pg = { path = "../../../crates/storage-pg" }
proxima-code = { path = "../../../flavors/code" }
proxima-flavor-goal = { path = "../../../flavors/goal" }
proxima-mcp-server = { path = "../../../crates/mcp-server" }
proxima-agent-memory = { path = "../../../flavors/agent-memory" }
proxima-llm-openai-compat = { path = "../../../crates/llm-openai-compat" }
keyring-core = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync"] }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
ciborium = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-chrome = "0.7"
time = { workspace = true }
dotenvy = "0.15"
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Per-OS keyring store implementations. The keyring crate split in
# v4 means the library (keyring-core) no longer ships any store —
# each platform pulls in its own and the binary wires it at boot
# via `keyring_core::set_default_store(...)`.
# `keychain` feature = classic Keychain (Generic Password items), the
# direct successor to keyring v3's `apple-native` feature. `protected`
# is the newer Data Protection Keychain and has different ACL prompts.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = "1"

[lints]
workspace = true
