[package]
name = "proxima-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
proxima-auth-oidc = { path = "../../crates/auth-oidc" }
proxima-code = { path = "../../flavors/code", optional = true }
proxima-core = { path = "../../crates/core" }
proxima-llm-openai-compat = { path = "../../crates/llm-openai-compat" }
proxima-blob-s3 = { path = "../../crates/blob-s3" }
proxima-storage-pg = { path = "../../crates/storage-pg", features = ["backend-api"] }
proxima = { path = "../../crates/proxima" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["code"]
# Default-on: the shipped host is substrate + code. `--no-default-features`
# is substrate-only.
code = ["dep:proxima-code", "proxima-code/host-api"]
# Compile the `/v1` REST surface into the binary. Serving it still needs
# `PROXIMA_REST_ENABLED=true` at runtime — see docs/17-rest-surface.md.
rest = ["proxima/rest"]

[dev-dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
proxima-auth-oidc = { path = "../../crates/auth-oidc" }
proxima-pg-testkit = { path = "../../crates/pg-testkit" }
jsonwebtoken = { workspace = true }

[lints]
workspace = true
