[package]
name = "proxima-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
proxima-core = { path = "../../crates/core" }
proxima = { path = "../../crates/proxima" }
proxima-flavor-goal = { path = "../../flavors/goal" }
proxima-mcp-server = { path = "../../crates/mcp-server" }
proxima-agent-memory = { path = "../../flavors/agent-memory" }
proxima-storage-pg = { path = "../../crates/storage-pg" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
