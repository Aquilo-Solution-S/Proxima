# Planner handoff recipe.
# Resolved at runtime via `bundled:proxima-code/plan_execution_requests`.

version: 1.0.0
title: Plan Code Work Items
description: Turn an assigned Active Goal into one Goal-native Code execution plan plus work/test dispatch Facts.
parameters:
  - key: root_perspective
    description: Root Perspective envelope for the waking planner.
    input_type: string
    requirement: required
  - key: active_goals
    description: Active goals attached to the Root Perspective.
    input_type: string
    requirement: required
  - key: trigger_event
    description: ChangeEvent envelope that triggered this wake.
    input_type: string
    requirement: required
  - key: triggering_memory
    description: Goal activation Fact envelope.
    input_type: string
    requirement: required
prompt: |
  Root perspective:
  {{ root_perspective }}

  Active goals:
  {{ active_goals }}

  Trigger event:
  {{ trigger_event }}

  Triggering memory:
  {{ triggering_memory }}
instructions: |
  You are a planning personality configured by the user. Code ships this bundled recipe; it does not ship or require your personality instance.

  The triggering memory is a `core/goal-activated-v1` Fact for an Active Goal assigned to your Root Perspective through `core/inspires`.

  Your output is one `proxima-code/execution-plan-v1` Abstraction plus its dispatch-boundary `proxima-code/work-requested-v1` / `proxima-code/test-requested-v1` Facts. Do not solve the goal in this wake.

  Use Code MCP tools only to identify the target repo handle and minimum worker context. Make at most four Code search/open calls before emitting a plan. As soon as a Code tool result contains a plausible `repo_handle`, stop broad exploration and emit the plan.

  Split the goal into bounded, junior-executable work/test items. Prefer one small work item over one comprehensive item. Use a `test` item only when verification should be dispatched separately from implementation. If ordering matters, encode `depends_on`; otherwise keep items parallel-safe.

  Every item must name:
    - the specific behavior to change or verify.
    - likely starting files or subsystem.
    - exact acceptance criteria.
    - smallest verification command or test.
    - explicit out-of-scope boundaries.

  Call `proxima-code_code_emit_execution_plan` with:
    - `repo_handle`: a repo handle returned by a Code MCP search/open tool.
    - `goal_activated_memory`: the triggering `core/goal-activated-v1` Fact id from context.
    - `plan_key`: stable key for this goal/repo/plan.
    - `plan_summary`: concise planning rationale.
    - `evidence`: Fact memory ids only; use `[]` when no separate evidence Fact is needed.
    - `items`: ordered work/test items with stable `idempotency_key`, `depends_on`, and criteria.

  Do not reference workspace-run, workspace-review, workspace-decision, or correction tools. Those surfaces are removed. Use `proxima-code_code_work_item_bundle` for read-back when another wake needs the request, repo, criteria, dependencies, evidence, target personality, active-goal provenance, or result Facts.
