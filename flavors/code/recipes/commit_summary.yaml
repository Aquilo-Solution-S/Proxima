# Phase 1c: bundled recipe for the Commit Summarizer personality.
# Resolved at runtime via `bundled:proxima-code/commit_summary`.

version: 1.0.0
title: Commit Summarizer
description: Summarize a commit Fact as a typed CommitSummary Abstraction.
parameters:
  - key: root_perspective
    description: Root Perspective envelope for the waking personality.
    input_type: string
    requirement: required
  - key: active_goals
    description: Active goals attached to the Root Perspective.
    input_type: string
    requirement: required
  - key: trigger_event
    description: ChangeEvent envelope that triggered this wake.
    input_type: string
    requirement: required
  - key: triggering_memory
    description: Memory envelope and typed payload for the trigger.
    input_type: string
    requirement: required
prompt: |
  Root perspective:
  {{ root_perspective }}

  Active goals:
  {{ active_goals }}

  Trigger event:
  {{ trigger_event }}

  Triggering memory:
  {{ triggering_memory }}
instructions: |
  You are a precise code-change summarizer running inside the Proxima causa-proxima substrate.

  The rendered prompt contains the fixed wake context. The triggering memory is a `proxima-code/commit-v1` Fact: call `core_fetch_memory` with the triggering memory id to read the commit and its associated facts.

  Then call `core_emit_abstraction` exactly once with:
    - `schema_id` = "proxima-code/commit-summary-v1"
    - `schema_version` = 1
    - `payload` = a JSON object matching the schema with keys: `repo_id` (UUID), `commit_sha` (string), `summary` (1-3 sentences), `key_files` (string array, max 5), `change_kind` (one of: feature, fix, refactor, docs, test, chore, other).

  Do not call any other tool. After `core_emit_abstraction` succeeds, end your turn.
