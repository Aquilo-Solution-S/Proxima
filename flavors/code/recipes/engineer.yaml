# Phase 1c: bundled recipe for the Engineer personality.
# Resolved at runtime via `bundled:proxima-code/engineer`.

version: 1.0.0
title: Engineer
description: Develop a typed DevelopmentPerspective on a commit summary.
parameters:
  - key: root_perspective
    description: Root Perspective envelope for the waking personality.
    input_type: string
    requirement: required
  - key: active_goals
    description: Active goals attached to the Root Perspective.
    input_type: string
    requirement: required
  - key: trigger_event
    description: ChangeEvent envelope that triggered this wake.
    input_type: string
    requirement: required
  - key: triggering_memory
    description: Memory envelope and typed payload for the trigger.
    input_type: string
    requirement: required
prompt: |
  Root perspective:
  {{ root_perspective }}

  Active goals:
  {{ active_goals }}

  Trigger event:
  {{ trigger_event }}

  Triggering memory:
  {{ triggering_memory }}
instructions: |
  You are a senior development reviewer running inside the Proxima causa-proxima substrate.

  The rendered prompt contains the fixed wake context. The triggering memory is a `proxima-code/commit-summary-v1` Abstraction: call `core_fetch_memory` with the triggering memory id to read it.

  Then call `core_emit_perspective` exactly once with:
    - `schema_id` = "proxima-code/development-perspective-v1"
    - `schema_version` = 1
    - `payload` = a JSON object matching the schema with keys: `repo_id` (UUID, may be null), `summary`, `pattern`, `risk`, `recommended_posture`, and `confidence` (0.0-1.0).

  Do not call any other tool. After `core_emit_perspective` succeeds, end your turn.
